# ENTORNO DE DESARROLLO LOCAL EXCLUSIVAMENTE.
# Publica puertos y no incorpora controles suficientes para Internet o produccion.
# Copie .env.example a .env, genere secretos unicos y complete los campos vacios.
# Docker Compose detendra la carga si falta una variable secreta obligatoria.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cap-prenatal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cap_prenatal}"
      POSTGRES_USER: "${POSTGRES_USER:-cap_prenatal_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env local}"
    ports:
      - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cap_prenatal_app} -d ${POSTGRES_DB:-cap_prenatal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cap-prenatal-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-cap_prenatal}"
      DB_USER: "${POSTGRES_USER:-cap_prenatal_app}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env local}"
      DB_SSL: "false"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET en el archivo .env local}"
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080,http://localhost:5173}"
      COOKIE_SAMESITE: "${COOKIE_SAMESITE:-lax}"
      TRUSTED_PROXY_CIDRS: "172.31.10.0/24"
      PDF_EXCEL_ENGINE: libreoffice
      LIBREOFFICE_PATH: /usr/bin/soffice
      N8N_INTEGRATION_ENABLED: "false"
      N8N_API_KEY_HASH_CURRENT: ""
      N8N_API_KEY_HASH_NEXT: ""
      N8N_ALLOWED_CIDRS: "172.31.30.0/24"
      APPOINTMENT_NOTIFICATION_START_OFFSET_DAYS: "1"
      APPOINTMENT_NOTIFICATION_WINDOW_DAYS: "1"
      APPOINTMENT_NOTIFICATION_TIMEZONE: America/Guatemala
      AUTOMATION_RATE_LIMIT_WINDOW_MS: "900000"
      AUTOMATION_RATE_LIMIT_MAX: "6"
      SEED_DIRECTOR_NAME: "${SEED_DIRECTOR_NAME:-}"
      SEED_DIRECTOR_USERNAME: "${SEED_DIRECTOR_USERNAME:-}"
      SEED_DIRECTOR_PASSWORD: "${SEED_DIRECTOR_PASSWORD:-}"
      SEED_CONFIRM_PRODUCTION: "${SEED_CONFIRM_PRODUCTION:-}"
    ports:
      - "127.0.0.1:3001:3001"
    expose:
      - "3001"
    networks:
      - app_internal
      - data_internal
      - automation_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.34.4
    container_name: cap-prenatal-n8n
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      GENERIC_TIMEZONE: America/Guatemala
      TZ: America/Guatemala
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: http://127.0.0.1:5678/
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
      N8N_RELEASE_TYPE: stable
      N8N_SECURE_COOKIE: "false"
      N8N_SAMESITE_COOKIE: strict
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY en el archivo .env local}"
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "100"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
    ports:
      - "127.0.0.1:5678:5678"
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - automation_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: cap-prenatal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: cap_prenatal_local_postgres_data
  n8n_data:
    name: cap_prenatal_local_n8n_data

networks:
  app_internal:
    name: cap_prenatal_local_app
    ipam:
      config:
        - subnet: 172.31.10.0/24
  data_internal:
    name: cap_prenatal_local_data
    ipam:
      config:
        - subnet: 172.31.20.0/24
  automation_internal:
    name: cap_prenatal_local_automation
    ipam:
      config:
        - subnet: 172.31.30.0/24
